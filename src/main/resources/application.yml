server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: ciudadactiva-backend

  sql:
    init:
      mode: never

  datasource:
    # URL de conexión a PostgreSQL (compatible con Supabase, Render o local)
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ciudadactiva}?sslmode=${DB_SSL_MODE:prefer}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false

  # Configuración para subida de fotos/archivos de evidencia simulada
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Configuración JWT para autenticación segura
app:
  jwt:
    secret: ${JWT_SECRET:CiudadActivaSecretKey2026SecureKeyWithMoreThan256BitsLongForHMACSHA256Algorithm}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 horas

# Configuración de Actuator y Health Check
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Configuración Swagger OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
