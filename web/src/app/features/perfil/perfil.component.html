<app-top-bar title="Perfil" subtitle="Tu cuenta en CiudadActiva" />
<div class="page page-narrow">
  <div class="card center">
    <div class="avatar lg" style="margin:0 auto">{{ inicial() }}</div>
    <h2 class="mt-sm">{{ session.user()?.nombre }}</h2>
    <p class="muted small">{{ session.user()?.email }}</p>
    <span class="chip mt-sm" style="background:#e3f2fd;color:#1565c0;border-color:#90caf9">{{ rolLabel() }}</span>
  </div>

  <div class="row between"><h2 class="section-title">Datos personales</h2>
    @if (!editando()) { <button class="btn ghost btn-sm" type="button" (click)="editando.set(true)"><app-icon name="edit" [size]="14" /> Editar</button> }</div>

  <form class="card" [formGroup]="form" (ngSubmit)="guardar()" novalidate>
    <label class="field"><span>Nombre completo *</span><input type="text" formControlName="nombre" [readonly]="!editando()" /></label>
    <label class="field"><span>Correo electrónico *</span><input type="email" formControlName="email" [readonly]="!editando()" />
      @if (form.controls.email.touched && form.controls.email.invalid) { <small class="field-error">Correo no válido</small> }</label>
    <label class="field"><span>Número de teléfono</span><input type="tel" formControlName="telefono" [readonly]="!editando()" /></label>
    <label class="field"><span>Dirección de residencia</span><input type="text" formControlName="direccion" [readonly]="!editando()" /></label>
    @if (error()) { <div class="alert error">{{ error() }}</div> }
    @if (editando()) {
      <div class="row gap">
        <button class="btn ghost grow" type="button" (click)="editando.set(false)">Cancelar</button>
        <button class="btn primary grow" type="submit" [disabled]="guardando()"><app-icon name="save" [size]="16" /> Guardar</button>
      </div>
    }
  </form>

  <h2 class="section-title">Conexión del backend</h2>
  <div class="card">
    <label class="field"><span>URL base de la API</span><input type="text" [(ngModel)]="url" /></label>
    <button class="btn ghost btn-sm" type="button" (click)="guardarUrl()"><app-icon name="server" [size]="14" /> Guardar URL</button>
  </div>

  <button class="btn danger block mt-lg" type="button" (click)="cerrarSesion()"><app-icon name="logout" [size]="18" /> Cerrar Sesión</button>
</div>
