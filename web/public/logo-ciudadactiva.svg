<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#113233" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Círculo base de fondo -->
  <circle cx="32" cy="32" r="30" fill="#F0F4F4" filter="url(#shadow)" />
  <!-- Conectores -->
  <line x1="32" y1="32" x2="20" y2="20" stroke="#74A596" stroke-width="4.5" stroke-linecap="round" />
  <line x1="32" y1="32" x2="44" y2="44" stroke="#113233" stroke-width="4.5" stroke-linecap="round" />
  <line x1="32" y1="32" x2="44" y2="22" stroke="#D4A373" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 5" />
  <!-- Nodos -->
  <circle cx="32" cy="32" r="7" fill="#113233" />
  <circle cx="20" cy="20" r="6" fill="#74A596" />
  <circle cx="44" cy="44" r="6" fill="#113233" />
  <circle cx="44" cy="22" r="4.5" fill="#D4A373" />
</svg>
