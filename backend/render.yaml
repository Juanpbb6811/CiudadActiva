# =======================================================================
# Render Blueprint (render.yaml) para CiudadActiva Backend API
# Permite despliegue automatizado con un solo clic en Render
# =======================================================================

services:
  - type: web
    name: ciudadactiva-backend
    env: docker
    dockerfilePath: Dockerfile
    rootDir: .
    plan: free
    region: ohio
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres.pfrnobukesevbtcfhbfr
      # La contraseña se configura en el panel de Render (no va en el repo)
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JPA_DDL_AUTO
        value: update
      - key: SHOW_SQL
        value: false
