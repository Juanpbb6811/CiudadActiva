# =======================================================================
# Render Blueprint (render.yaml) para CiudadActiva Backend API
# Permite despliegue automatizado con un solo clic en Render
# =======================================================================

services:
  - type: web
    name: ciudadactiva-backend
    env: docker
    dockerfilePath: Dockerfile
    rootDir: .
    plan: free
    region: ohio
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres.otbdykjhvusjkzjzclqw
      - key: SPRING_DATASOURCE_PASSWORD
        value: XoUF92rHTaxms6lj
      - key: JWT_SECRET
        generateValue: true
      - key: JPA_DDL_AUTO
        value: update
      - key: SHOW_SQL
        value: false
