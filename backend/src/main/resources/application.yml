server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: ciudadactiva-backend

  sql:
    init:
      mode: never

  datasource:
    # Configuración de base de datos PostgreSQL en Supabase
    # Modo Pooler (IPv4/IPv6, compatible con desarrollo local Windows y producción):
    #   Host: aws-0-us-east-2.pooler.supabase.com | Puerto: 5432 (Session) / 6543 (Transaction)
    #   Usuario: postgres.otbdykjhvusjkzjzclqw
    # Modo Directo (IPv6 / Cloud como Render o entornos con IPv6 nativo):
    #   Host: db.otbdykjhvusjkzjzclqw.supabase.co | Puerto: 5432
    #   Usuario: postgres
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.otbdykjhvusjkzjzclqw}
    password: ${SPRING_DATASOURCE_PASSWORD:XoUF92rHTaxms6lj}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 600000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false

  # Configuración para subida de fotos/archivos de evidencia simulada
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Configuración JWT para autenticación segura
app:
  jwt:
    secret: ${JWT_SECRET:CiudadActivaSecretKey2026SecureKeyWithMoreThan256BitsLongForHMACSHA256Algorithm}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 horas

# Configuración de Actuator y Health Check
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Configuración Swagger OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
